<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F2F2F7">
<title>Ink & Water</title>
<style>
  :root {
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --label: #000000;
    --label2: rgba(60, 60, 67, 0.6);
    --label3: rgba(60, 60, 67, 0.3);
    --fill: rgba(118, 118, 128, 0.12);
    --separator: rgba(60, 60, 67, 0.18);
    --bar: rgba(249, 249, 249, 0.82);
    --accent: #1F3A5F;
    --on-accent: #FFFFFF;
    --green: #34C759;
    --red: #FF3B30;
    --desk: #DCDCE2;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    --serif: "New York", ui-serif, "Iowan Old Style", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1C1C1E;
      --label: #FFFFFF;
      --label2: rgba(235, 235, 245, 0.6);
      --label3: rgba(235, 235, 245, 0.3);
      --fill: rgba(118, 118, 128, 0.24);
      --separator: rgba(84, 84, 88, 0.6);
      --bar: rgba(22, 22, 24, 0.82);
      --accent: #8FB3E0;
      --on-accent: #0B1526;
      --desk: #111114;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--desk); font-family: var(--sans); color: var(--label); -webkit-font-smoothing: antialiased; }
  body { display: grid; place-items: center; overflow: hidden; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  button:disabled { cursor: default; }

  /* The phone. On a real phone it fills the screen. */
  .device {
    position: relative; width: 393px; height: 852px; border-radius: 56px; overflow: clip;
    background: var(--bg); box-shadow: 0 0 0 11px #1a1a1c, 0 0 0 13px #3a3a3e, 0 40px 80px rgba(0,0,0,0.35);
    isolation: isolate;
  }
  /* On an actual phone the app fills the screen; elsewhere the frame is scaled to fit (see fitDevice). */
  body.native { place-items: stretch; }
  body.native .device { position: relative; top: auto; left: auto; width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; transform: none !important; }
  body.native .status, body.native .island, body.native .home { display: none; }
  .device { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); transform-origin: center; }

  .status { position: absolute; z-index: 50; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 46px; font-weight: 600; font-size: 17px; pointer-events: none; transition: color .4s; }
  .status.light { color: #fff; }
  .status svg { height: 13px; }
  .island { position: absolute; z-index: 51; top: 11px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; border-radius: 20px; background: #000; pointer-events: none; }
  .home { position: absolute; z-index: 51; bottom: 8px; left: 50%; transform: translateX(-50%); width: 139px; height: 5px; border-radius: 3px; background: var(--label); opacity: .85; pointer-events: none; transition: background .4s; }
  .home.light { background: #fff; }

  /* Screens and navigation */
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); transition: transform .5s cubic-bezier(.32,.72,0,1), opacity .5s; }
  .screen.hidden-right { transform: translateX(100%); pointer-events: none; }
  .screen.hidden-left { transform: translateX(-28%); opacity: .6; pointer-events: none; }
  .screen.faded { opacity: 0; pointer-events: none; }
  .nav { flex: none; height: 98px; padding: 54px 8px 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: .5px solid var(--separator); position: relative; z-index: 5; }
  .nav h1 { margin: 0; font-size: 17px; font-weight: 600; text-align: center; max-width: 210px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav .left { justify-self: start; } .nav .right { justify-self: end; }
  .navbtn { display: inline-flex; align-items: center; gap: 2px; height: 44px; min-width: 44px; justify-content: center; padding: 0 8px; color: var(--accent); font-size: 17px; }
  .navbtn:disabled { color: var(--label3); }
  .navbtn svg { width: 22px; height: 22px; }
  .title-input { font: 600 17px var(--sans); color: var(--label); background: transparent; border: 0; text-align: center; width: 200px; outline: none; border-radius: 8px; padding: 4px; }
  .title-input:focus { background: var(--fill); }
  .content { flex: 1; overflow-y: auto; padding: 20px 20px 120px; scrollbar-width: none; }
  .content::-webkit-scrollbar { display: none; }
  .bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 34px; background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--separator); z-index: 5; }
  .prominent { width: 100%; height: 52px; border-radius: 26px; background: var(--accent); color: var(--on-accent); font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .15s, opacity .2s; }
  .prominent:active:not(:disabled) { transform: scale(.97); }
  .prominent:disabled { opacity: .35; }
  .prominent svg { width: 20px; height: 20px; }
  .serif { font-family: var(--serif); }
  .section-title { font: 600 22px var(--serif); margin: 0 0 6px; letter-spacing: .2px; }
  .sub { font-size: 15px; line-height: 1.35; color: var(--label2); margin: 0; }
  .card { background: var(--card); border-radius: 18px; }

  /* Welcome */
  #welcome { background: #000; }
  #welcome canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #welcome .scrim { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 45%, rgba(0,0,0,.4) 68%, rgba(0,0,0,.8)); }
  #welcome .copy { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 28px 58px; color: #fff; opacity: 0; transform: translateY(24px); transition: opacity 1.2s .4s, transform 1.2s .4s cubic-bezier(.2,.8,.2,1); }
  #welcome.ready .copy { opacity: 1; transform: none; }
  #welcome h2 { font: 600 52px/1.05 var(--serif); margin: 0 0 14px; letter-spacing: -.5px; }
  #welcome p { font-size: 20px; line-height: 1.32; margin: 0 0 26px; color: rgba(255,255,255,.86); }
  #welcome .prominent { background: #fff; color: #000; }

  /* Studio */
  .tray { position: relative; width: 100%; aspect-ratio: 1; border-radius: 28px; overflow: hidden; box-shadow: 0 12px 24px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.06); touch-action: none; cursor: crosshair; }
  .tray canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tray .guide { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .tray .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 15px; color: rgba(0,0,0,.45); pointer-events: none; transition: opacity .4s; }
  .tray .empty svg { width: 34px; height: 34px; animation: pulse 2s ease-in-out infinite; }
  .tray.dark-paper .empty { color: rgba(255,255,255,.6); }
  @keyframes pulse { 50% { opacity: .35; transform: scale(.92); } }
  .tools { margin-top: 24px; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--fill); position: relative; }
  .tools .pill { position: absolute; top: 4px; bottom: 4px; border-radius: 999px; background: var(--card); box-shadow: 0 2px 6px rgba(0,0,0,.12); transition: left .35s cubic-bezier(.3,1.3,.5,1), width .35s; }
  .tool { flex: 1; position: relative; z-index: 1; height: 40px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 600; color: var(--label2); transition: color .2s; }
  .tool svg { width: 17px; height: 17px; }
  .tool[aria-pressed="true"] { color: var(--label); }
  .inks { margin-top: 22px; display: flex; justify-content: center; gap: 14px; transition: opacity .3s; }
  .inks.off { opacity: .35; pointer-events: none; }
  .ink { width: 48px; height: 48px; border-radius: 50%; padding: 4px; position: relative; transition: transform .25s cubic-bezier(.3,1.4,.5,1); }
  .ink span { display: block; width: 40px; height: 40px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1), inset 0 -8px 14px rgba(0,0,0,.12); }
  .ink::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--label); opacity: 0; transition: opacity .2s; }
  .ink[aria-pressed="true"] { transform: scale(1.08); }
  .ink[aria-pressed="true"]::after { opacity: 1; }
  .hint { margin: 18px 0 0; text-align: center; font-size: 13px; color: var(--label2); min-height: 18px; transition: opacity .25s; }

  /* Menus and sheets */
  .menu { position: absolute; z-index: 60; top: 92px; right: 14px; width: 250px; border-radius: 14px; overflow: hidden; background: var(--bar); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); box-shadow: 0 10px 40px rgba(0,0,0,.25); transform-origin: top right; transform: scale(.6); opacity: 0; pointer-events: none; transition: transform .3s cubic-bezier(.3,1.3,.5,1), opacity .2s; }
  .menu.open { transform: none; opacity: 1; pointer-events: auto; }
  .menu button { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 11px 16px; font-size: 17px; text-align: left; border-bottom: .5px solid var(--separator); }
  .menu button:last-child { border-bottom: 0; }
  .menu button:active { background: var(--fill); }
  .menu .group-label { padding: 8px 16px 4px; font-size: 13px; color: var(--label2); }
  .menu .gap { height: 8px; background: rgba(0,0,0,.08); }
  .menu .danger { color: var(--red); }
  .menu .swatches { display: flex; gap: 3px; }
  .menu .swatches i { width: 10px; height: 10px; border-radius: 50%; display: block; }
  .menu svg { width: 18px; height: 18px; }
  .scrim-tap { position: absolute; inset: 0; z-index: 55; display: none; }
  .scrim-tap.on { display: block; }

  .sheet-backdrop { position: absolute; inset: 0; z-index: 70; background: rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .35s; }
  .sheet-backdrop.on { opacity: 1; pointer-events: auto; }
  .sheet { position: absolute; z-index: 71; left: 0; right: 0; bottom: 0; min-height: 470px; border-radius: 28px 28px 0 0; background: var(--bg); padding: 8px 20px 40px; transform: translateY(105%); transition: transform .45s cubic-bezier(.32,.72,0,1); }
  .sheet.on { transform: none; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label3); margin: 0 auto 6px; }
  .sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 44px; margin-bottom: 12px; }
  .sheet-head h3 { margin: 0; font-size: 17px; font-weight: 600; }

  /* Make it real */
  .art { width: 100%; aspect-ratio: 1; border-radius: 24px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,.12); background: var(--fill); position: relative; }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; position: absolute; inset: 0; transition: opacity .8s, transform .8s; }
  .styles { display: grid; gap: 12px; margin-top: 16px; }
  .style { display: flex; gap: 14px; align-items: flex-start; text-align: left; padding: 16px; border-radius: 18px; background: var(--card); box-shadow: inset 0 0 0 2px transparent; transition: box-shadow .2s; }
  .style[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); }
  .style .check { flex: none; width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--label3); display: grid; place-items: center; transition: background .2s; }
  .style[aria-pressed="true"] .check { background: var(--accent); box-shadow: none; }
  .style .check svg { width: 14px; height: 14px; color: var(--on-accent); opacity: 0; }
  .style[aria-pressed="true"] .check svg { opacity: 1; }
  .style b { display: block; font-size: 17px; margin-bottom: 3px; }
  .style span { font-size: 15px; color: var(--label2); line-height: 1.3; }
  .sheen { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.35) 50%, transparent 65%); background-size: 250% 100%; mix-blend-mode: soft-light; animation: sheen 2.6s ease-in-out infinite; }
  @keyframes sheen { from { background-position: 130% 0; } to { background-position: -30% 0; } }
  .breathe { animation: breathe 4.5s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(.975); filter: saturate(.85); } }
  .stage { text-align: center; margin-top: 28px; }
  .stage h3 { font: 600 22px var(--serif); margin: 0 0 8px; min-height: 28px; transition: opacity .3s; }
  .bar-track { height: 4px; border-radius: 2px; background: var(--fill); margin: 18px 40px 0; overflow: hidden; }
  .bar-fill { height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width 1s linear; }
  .segmented { display: flex; padding: 2px; border-radius: 9px; background: var(--fill); margin: 18px 0 26px; position: relative; }
  .segmented button { flex: 1; height: 30px; font-size: 13px; font-weight: 600; border-radius: 7px; position: relative; z-index: 1; }
  .segmented .thumb { position: absolute; top: 2px; bottom: 2px; width: calc(50% - 2px); border-radius: 7px; background: var(--card); box-shadow: 0 3px 8px rgba(0,0,0,.12); transition: transform .3s cubic-bezier(.3,1.2,.5,1); }
  .products { margin-top: 16px; overflow: hidden; }
  .prow { width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 16px; text-align: left; position: relative; }
  .prow + .prow::before { content: ""; position: absolute; top: 0; left: 92px; right: 0; border-top: .5px solid var(--separator); }
  .prow:active:not(:disabled) { background: var(--fill); }
  .thumb-img { flex: none; width: 62px; height: 62px; border-radius: 12px; background: var(--fill) center/cover; display: grid; place-items: center; color: var(--label2); }
  .thumb-img svg { width: 26px; height: 26px; }
  .prow .meta { flex: 1; min-width: 0; }
  .prow .meta b { display: block; font-size: 17px; }
  .prow .meta small { display: block; font-size: 13px; color: var(--label2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prow .price { font-weight: 600; font-size: 17px; }
  .chev { width: 8px; height: 13px; color: var(--label3); flex: none; }
  .spinner { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid var(--fill); border-top-color: var(--label2); animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box { text-align: center; padding: 60px 20px; }
  .error-box svg { width: 44px; height: 44px; color: var(--label2); }
  .error-box h3 { font-size: 20px; margin: 12px 0 6px; }

  /* Product */
  .carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; border-radius: 24px; aspect-ratio: 1; scrollbar-width: none; background: var(--fill); }
  .carousel::-webkit-scrollbar { display: none; }
  .carousel img { flex: none; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: center; }
  .dots { display: flex; justify-content: center; gap: 7px; margin-top: 10px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--label3); transition: background .2s; }
  .dots i.on { background: var(--label); }
  .ptitle { font: 600 22px/1.2 var(--serif); margin: 18px 0 6px; }
  .pprice { font-size: 20px; font-weight: 600; margin: 8px 0 18px; }
  .maker { display: flex; gap: 12px; align-items: center; padding: 14px; font-size: 15px; }
  .maker svg { width: 22px; height: 22px; color: var(--accent); flex: none; }
  .desc { font-size: 15px; line-height: 1.4; color: var(--label2); white-space: pre-line; margin-top: 18px; }

  /* Checkout */
  .line { display: flex; justify-content: space-between; font-size: 15px; padding: 5px 0; }
  .line span:last-child { color: var(--label2); }
  .line.total { font-size: 17px; font-weight: 600; border-top: .5px solid var(--separator); margin-top: 6px; padding-top: 11px; }
  .line.total span:last-child { color: var(--label); }
  .pay { background: var(--label); color: var(--bg); }
  .note { display: flex; gap: 6px; align-items: center; justify-content: center; font-size: 13px; color: var(--label2); margin-top: 12px; }
  .note svg { width: 15px; height: 15px; }
  .done { text-align: center; padding-top: 40px; }
  .done svg { width: 68px; height: 68px; color: var(--green); animation: pop .6s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } }
  .done h3 { font: 600 24px var(--serif); margin: 16px 0 8px; }
  .done .num { font-weight: 600; font-variant-numeric: tabular-nums; }

  .toast { position: absolute; z-index: 80; top: 60px; left: 50%; transform: translate(-50%, -140%); max-width: 330px; padding: 12px 18px; border-radius: 22px; background: var(--bar); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); box-shadow: 0 8px 30px rgba(0,0,0,.2); font-size: 14px; transition: transform .45s cubic-bezier(.3,1.3,.5,1); }
  .toast.on { transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<main class="device" id="device">
  <div class="status" id="status"><span>9:41</span><svg viewBox="0 0 70 13" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="3" height="5" rx="1"/><rect x="5" y="5.5" width="3" height="7.5" rx="1"/><rect x="10" y="3" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="13" rx="1"/><path d="M30 3.5c2.6 0 5 1 6.7 2.7l1.3-1.3A11.3 11.3 0 0 0 30 1.6c-3.1 0-5.9 1.2-8 3.3l1.3 1.3A9.4 9.4 0 0 1 30 3.5Zm0 3.7c1.6 0 3 .6 4.1 1.6l1.3-1.3A7.6 7.6 0 0 0 30 5.3c-2.1 0-4 .8-5.4 2.2l1.3 1.3c1.1-1 2.5-1.6 4.1-1.6Zm0 3.6c.6 0 1.2.2 1.6.6L30 13l-1.6-1.6c.4-.4 1-.6 1.6-.6Z"/><rect x="44" y="1" width="22" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="46" y="3" width="18" height="7" rx="2"/><rect x="67" y="4.5" width="1.5" height="4" rx=".7" opacity=".4"/></svg></div>
  <div class="island"></div>
  <div class="home" id="home"></div>

  <!-- Welcome -->
  <section class="screen" id="welcome" aria-label="Welcome">
    <canvas id="welcome-canvas"></canvas>
    <div class="scrim"></div>
    <div class="copy">
      <h2>Ink &amp; Water</h2>
      <p>Float ink on water and comb it into a pattern that's yours alone. Then have it made into silk, by hand.</p>
      <button class="prominent" id="begin">Begin</button>
    </div>
  </section>

  <!-- Studio -->
  <section class="screen faded" id="studio" aria-label="Studio">
    <header class="nav">
      <div class="left"><button class="navbtn" id="undo" aria-label="Undo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button></div>
      <input class="title-input" id="title" value="Untitled No. 1" aria-label="Piece title" maxlength="40">
      <div class="right"><button class="navbtn" id="more" aria-label="More"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><circle cx="7.5" cy="12" r=".9" fill="currentColor"/><circle cx="12" cy="12" r=".9" fill="currentColor"/><circle cx="16.5" cy="12" r=".9" fill="currentColor"/></svg></button></div>
    </header>
    <div class="content">
      <div class="tray" id="tray" role="img" aria-label="Marbling tray">
        <canvas id="tray-canvas"></canvas>
        <svg class="guide" id="guide" viewBox="0 0 1 1" preserveAspectRatio="none"></svg>
        <div class="empty" id="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M12 2.7s-6.5 7.1-6.5 11.8a6.5 6.5 0 0 0 13 0C18.5 9.8 12 2.7 12 2.7Z"/></svg>Tap the water to float your first drop</div>
      </div>
      <div class="tools" id="tools" role="group" aria-label="Tool"><div class="pill" id="pill"></div></div>
      <div class="inks" id="inks" role="group" aria-label="Ink"></div>
      <p class="hint" id="hint"></p>
    </div>
    <div class="bottom"><button class="prominent" id="make" disabled><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5 13.9 8l5.6 1.9-5.6 1.9L12 17.3l-1.9-5.5L4.5 9.9 10.1 8 12 2.5ZM18.5 15l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9.9-2.6ZM5.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8L3 18l1.8-.7.7-1.8Z"/></svg><span>Make It Real</span></button></div>
    <div class="scrim-tap" id="menu-scrim"></div>
    <div class="menu" id="menu" role="menu"></div>
  </section>

  <!-- Make it real -->
  <section class="screen hidden-right" id="make-screen" aria-label="Make it real">
    <header class="nav">
      <div class="left"><button class="navbtn" id="make-back"><svg viewBox="0 0 12 21" width="12" height="21" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10.5 10 19"/></svg><span>Studio</span></button></div>
      <h1 id="make-title">Untitled</h1>
      <div class="right"></div>
    </header>
    <div class="content" id="make-content"></div>

<script>
'use strict';

// Animation frames that keep running when the page isn't visible (browsers pause
// requestAnimationFrame then), so a backgrounded demo never stalls mid-pour.
const nextFrame = cb => document.hidden ? setTimeout(() => cb(performance.now()), 16) : requestAnimationFrame(cb);

// ---------------------------------------------------------------------------
// Palettes (same as the iOS app)
// ---------------------------------------------------------------------------
const PALETTES = [
  {id: 'harbor', name: 'Harbor', paper: '#F4EFE6', inks: [['Indigo', '#1F3A5F'], ['Terracotta', '#C8553D'], ['Saffron', '#E9C46A'], ['Teal', '#2A9D8F'], ['Cream', '#F7F3EA']]},
  {id: 'spice', name: 'Spice Market', paper: '#FBF3E4', inks: [['Madder', '#9C2F2F'], ['Turmeric', '#E39B2D'], ['Fig', '#3D2B3D'], ['Pine', '#3D5A40'], ['Linen', '#FFF8EC']]},
  {id: 'moss', name: 'Moss & Pearl', paper: '#EEF0E8', inks: [['Forest', '#31493C'], ['Sage', '#7A9E7E'], ['Lichen', '#B3C5A5'], ['Brass', '#C9A45C'], ['Pearl', '#FBFBF6']]},
  {id: 'rose', name: 'Rose Quartz', paper: '#FAF1EF', inks: [['Garnet', '#8C2F39'], ['Blush', '#E5989B'], ['Peach', '#FFCDB2'], ['Dusk', '#6D6875'], ['Petal', '#FFF6F3']]},
  {id: 'midnight', name: 'Midnight Koi', paper: '#0F1626', inks: [['Gold', '#E0B354'], ['Bone', '#F2E9DC'], ['Lake', '#3A6EA5'], ['Koi', '#D9643A'], ['Ink', '#0F1626']]},
];
const rgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
const isLight = hex => { const [r, g, b] = rgb(hex); return 0.299 * r + 0.587 * g + 0.114 * b > 0.6; };

// ---------------------------------------------------------------------------
// Marbling renderer: each pixel walks the operations backwards (Jaffer).
// Mirrors Marbling.metal. Ops are 8 floats: see MarbleOp.encoded in Swift.
// ---------------------------------------------------------------------------
const FRAG = `#version 300 es
precision highp float;
uniform highp sampler2D uOps;
uniform int uCount;
uniform vec2 uSize;
uniform vec2 uOrigin;
uniform vec3 uPaper;
uniform vec3 uInks[8];
uniform int uInkCount;
out vec4 outColor;
void main() {
  // gl_FragCoord is window-relative; the square tray may start off-canvas.
  vec2 local = gl_FragCoord.xy - uOrigin;
  vec2 p = vec2(local.x, uSize.y - local.y) / uSize;
  for (int i = uCount - 1; i >= 0; i--) {
    vec4 a = texelFetch(uOps, ivec2(i * 2, 0), 0);
    vec4 b = texelFetch(uOps, ivec2(i * 2 + 1, 0), 0);
    int kind = int(a.x + 0.5);
    if (kind == 0) {
      vec2 c = a.yz; float r2 = a.w * a.w; vec2 d = p - c; float d2 = dot(d, d);
      if (d2 < r2) { int ink = int(b.x + 0.5) % max(uInkCount, 1); outColor = vec4(uInks[ink], 1.0); return; }
      p = c + d * sqrt(1.0 - r2 / d2);
    } else if (kind == 1) {
      vec2 o = a.yz; vec2 m = vec2(a.w, b.x); vec2 n = vec2(-m.y, m.x);
      float dist = abs(dot(p - o, n));
      p -= m * (b.y * b.z / (dist + b.z));
    } else if (kind == 3) {
      // A comb: each point feels only its nearest tine, and midpoints between tines stay put.
      vec2 o = a.yz; vec2 m = vec2(a.w, b.x); vec2 n = vec2(-m.y, m.x);
      float spacing = b.w, lambda = b.z;
      float off = dot(p - o, n) / spacing;
      float dn = abs(off - floor(off + 0.5)) * spacing;
      float edge = lambda / (0.5 * spacing + lambda);
      float z = b.y * (lambda / (dn + lambda) - edge) / (1.0 - edge);
      p -= m * z;
    } else if (kind == 2) {
      vec2 s = a.yz; vec2 ab = vec2(a.w, b.x) - s;
      float t = clamp(dot(p - s, ab) / max(dot(ab, ab), 1e-8), 0.0, 1.0);
      vec2 q = s + ab * t; float reach = b.y;
      p -= ab * exp(-dot(p - q, p - q) / (reach * reach));
    }
  }
  outColor = vec4(uPaper, 1.0);
}`;
const VERT = `#version 300 es
in vec2 pos; void main() { gl_Position = vec4(pos, 0.0, 1.0); }`;

class MarbleRenderer {
  constructor(canvas, {preserve = false} = {}) {
    this.canvas = canvas;
    const gl = this.gl = canvas.getContext('webgl2', {antialias: false, preserveDrawingBuffer: preserve});
    if (!gl) throw new Error('WebGL2 is not available in this browser.');
    const compile = (type, src) => {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    };
    const prog = this.prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'pos');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    this.tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, this.tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    this.u = name => gl.getUniformLocation(prog, name);
  }
  resize(scale = Math.min(window.devicePixelRatio || 1, 2) * 1.5) {
    // Layout size, not on-screen size, so the frame's fit-to-window scale doesn't blur it.
    const w = Math.max(1, Math.round(this.canvas.clientWidth * scale)), h = Math.max(1, Math.round(this.canvas.clientHeight * scale));
    if (this.canvas.width !== w || this.canvas.height !== h) { this.canvas.width = w; this.canvas.height = h; }
  }
  draw(ops, palette) {
    const gl = this.gl;
    const data = new Float32Array(Math.max(ops.length, 1) * 8);
    ops.forEach((op, i) => data.set(encode(op), i * 8));
    gl.bindTexture(gl.TEXTURE_2D, this.tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, Math.max(ops.length, 1) * 2, 1, 0, gl.RGBA, gl.FLOAT, data);
    // Cover a non-square canvas (the welcome screen) with a square tray.
    const side = Math.max(this.canvas.width, this.canvas.height);
    const x0 = (this.canvas.width - side) / 2, y0 = (this.canvas.height - side) / 2;
    gl.viewport(x0, y0, side, side);
    gl.uniform1i(this.u('uOps'), 0);
    gl.uniform1i(this.u('uCount'), ops.length);
    gl.uniform2f(this.u('uSize'), side, side);
    gl.uniform2f(this.u('uOrigin'), x0, y0);
    gl.uniform3fv(this.u('uPaper'), rgb(palette.paper));
    const inks = new Float32Array(24);
    palette.inks.forEach(([, hex], i) => inks.set(rgb(hex), i * 3));
    gl.uniform3fv(this.u('uInks'), inks);
    gl.uniform1i(this.u('uInkCount'), palette.inks.length);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
}
function encode(op) {
  switch (op.kind) {
    case 'drop': return [0, op.x, op.y, op.r, op.ink, 0, 0, 0];
    case 'tine': return [1, op.ox, op.oy, op.mx, op.my, op.strength, op.sharp, 0];
    case 'swirl': return [2, op.ax, op.ay, op.bx, op.by, op.reach, 0, 0];
    case 'comb': return [3, op.ox, op.oy, op.mx, op.my, op.strength, op.sharp, op.spacing];
  }
}

// ---------------------------------------------------------------------------
// Studio model: touches become marbling operations (mirrors StudioModel.swift)
// ---------------------------------------------------------------------------
const MAX_OPS = 700;
const TOOLS = [
  {id: 'drop', title: 'Drop', hint: 'Tap to float ink. Hold to let it spread.', icon: '<path d="M12 2.7s-6.5 7.1-6.5 11.8a6.5 6.5 0 0 0 13 0C18.5 9.8 12 2.7 12 2.7Z" fill="currentColor"/>'},
  {id: 'swirl', title: 'Swirl', hint: 'Drag through the water to pull the ink.', icon: '<path d="M12 12c0-2 1.6-3.3 3.3-3 2.5.4 3.6 3.4 2.4 5.8-1.6 3.2-6 4-8.9 1.9-3.7-2.6-3.8-8.2-.5-11.2C12.4 1.7 18.6 2.6 21 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>'},
  {id: 'comb', title: 'Comb', hint: 'Drag across the tray to comb every color at once.', icon: '<path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>'},
];

const studio = {
  ops: [], history: [], palette: PALETTES[0], ink: 0, tool: 'drop',
  pressing: false, last: null, combGuide: null, composing: false, growth: 0,
};

// One comb operation: evenly spaced tines dragged along (dx, dy) across the whole tray.
function combOps(dx, dy, spacing = 0.07) {
  const len = Math.hypot(dx, dy) || 1;
  return [{kind: 'comb', ox: 0.5, oy: 0.5, mx: dx / len, my: dy / len, strength: 0, sharp: 0.012, spacing}];
}

function animatePull(tines, strength, ms) {
  studio.ops.push(...tines);
  const start = performance.now();
  return new Promise(resolve => {
    const step = now => {
      const t = Math.min((now - start) / ms, 1), eased = 1 - Math.pow(1 - t, 3);
      for (const tine of tines) tine.strength = strength * eased;
      dirty();
      t < 1 ? nextFrame(step) : resolve();
    };
    nextFrame(step);
  });
}

function dropInk(x, y) {
  const op = {kind: 'drop', x, y, r: 0.012, ink: studio.ink};
  studio.ops.push(op);
  // Every drop finishes landing; only undo or clearing the tray (a new epoch) stops it.
  const epoch = studio.growth, settled = 0.055;
  const holding = () => studio.pressing && studio.ops.at(-1) === op;
  const step = () => {
    if (epoch !== studio.growth || !studio.ops.includes(op) || op.r >= 0.2) return;
    if (op.r >= settled && !holding()) return;
    op.r += op.r < settled ? (settled - op.r) * 0.22 + 0.0008 : 0.0011;
    dirty();
    nextFrame(step);
  };
  nextFrame(step);
}

function touchBegan(x, y) {
  if (studio.composing || studio.ops.length >= MAX_OPS) return;
  studio.pressing = true; studio.last = [x, y];
  studio.history.push(studio.ops.length);
  if (studio.tool === 'drop') { dropInk(x, y); haptic(); }
  if (studio.tool === 'comb') studio.combGuide = {start: [x, y], end: [x, y]};
  dirty();
}
function touchMoved(x, y) {
  if (!studio.pressing) return;
  if (studio.tool === 'swirl') {
    const [lx, ly] = studio.last;
    if (Math.hypot(x - lx, y - ly) > 0.012 && studio.ops.length < MAX_OPS) {
      studio.ops.push({kind: 'swirl', ax: lx, ay: ly, bx: x, by: y, reach: 0.06});
      studio.last = [x, y]; dirty();
    }
  } else if (studio.tool === 'comb' && studio.combGuide) {
    studio.combGuide.end = [x, y]; drawGuide();
  }
}
function touchEnded(x, y) {
  if (!studio.pressing) return;
  studio.pressing = false;
  if (studio.tool === 'swirl' && studio.history.at(-1) === studio.ops.length) studio.history.pop();
  if (studio.tool === 'comb' && studio.combGuide) {
    const [sx, sy] = studio.combGuide.start, dx = x - sx, dy = y - sy, len = Math.hypot(dx, dy);
    studio.combGuide = null; drawGuide();
    if (len > 0.04) { animatePull(combOps(dx, dy), Math.min(Math.max(len * 0.3, 0.03), 0.17), 500); haptic(); }
    else studio.history.pop();
  }
  dirty();
}
function undo() {
  if (!studio.history.length || studio.composing) return;
  studio.growth++;
  studio.ops.length = studio.history.pop();
  dirty();
}
function clearTray() { studio.growth++; studio.ops = []; studio.history = []; dirty(); }

// Fills a tray with a classic composition, step by step, so it can be watched.
async function compose(target, seed) {
  let s = seed || Math.floor(Math.random() * 1e9) + 1;
  const rand = (lo, hi) => { s = (s * 16807) % 2147483647; return lo + (s / 2147483647) * (hi - lo); };
  target.composing = true; target.ops = []; target.history = [];
  const inkCount = target.palette.inks.length;
  for (let i = 0; i < 70; i++) {
    const op = {kind: 'drop', x: rand(0.12, 0.88), y: rand(0.12, 0.88), r: 0, ink: i % inkCount};
    const full = rand(0.035, 0.085);
    target.ops.push(op);
    for (let k = 1; k <= 4; k++) { op.r = full * k / 4; target.dirty(); await frame(); }
  }
  const angle = rand(0, Math.PI * 2), mx = Math.cos(angle), my = Math.sin(angle);
  const pull = async (tines, strength, ms) => {
    target.ops.push(...tines);
    const start = performance.now();
    for (;;) {
      const t = Math.min((performance.now() - start) / ms, 1), e = 1 - Math.pow(1 - t, 3);
      tines.forEach(tine => tine.strength = strength * e);
      target.dirty(); if (t >= 1) break; await frame();
    }
  };
  await pull(combOps(mx, my, 0.06), 0.22, 700);
  await pull(combOps(-mx, -my, 0.06), 0.2, 700);
  await pull(combOps(-my, mx, 0.11), 0.12, 600);
  target.history = [0]; target.composing = false; target.dirty();
}
const frame = () => new Promise(r => nextFrame(r));

// ---------------------------------------------------------------------------
// Studio UI
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
let trayRenderer, needsDraw = false;
studio.dirty = dirty;
function dirty() {
  if (needsDraw) return;
  needsDraw = true;
  nextFrame(() => {
    needsDraw = false;
    trayRenderer.resize(); trayRenderer.draw(studio.ops, studio.palette);
    $('empty').style.opacity = studio.ops.length ? 0 : 1;
    $('undo').disabled = !studio.history.length || studio.composing;
    $('make').disabled = !studio.ops.length || studio.composing;
  });
}
function haptic() { navigator.vibrate?.(8); }

function buildTools() {
  const tools = $('tools');
  TOOLS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tool'; b.dataset.tool = t.id;
    b.innerHTML = `<svg viewBox="0 0 24 24">${t.icon}</svg>${t.title}`;
    b.onclick = () => selectTool(t.id);
    tools.appendChild(b);
  });
  selectTool('drop');
}
function selectTool(id) {
  studio.tool = id;
  document.querySelectorAll('.tool').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === id));
  const btn = document.querySelector(`.tool[data-tool="${id}"]`);
  const pill = $('pill');
  nextFrame(() => { pill.style.left = btn.offsetLeft + 'px'; pill.style.width = btn.offsetWidth + 'px'; });
  $('inks').classList.toggle('off', id !== 'drop');
  const hint = $('hint');
  hint.style.opacity = 0;
  setTimeout(() => { hint.textContent = TOOLS.find(t => t.id === id).hint; hint.style.opacity = 1; }, 150);
}
function buildInks() {
  const inks = $('inks');
  inks.innerHTML = '';
  studio.palette.inks.forEach(([name, hex], i) => {
    const b = document.createElement('button');
    b.className = 'ink'; b.setAttribute('aria-label', name); b.setAttribute('aria-pressed', i === studio.ink);
    b.innerHTML = `<span style="background:${hex}"></span>`;
    b.onclick = () => { studio.ink = i; document.querySelectorAll('.ink').forEach((x, j) => x.setAttribute('aria-pressed', j === i)); haptic(); };
    inks.appendChild(b);
  });
  $('tray').classList.toggle('dark-paper', !isLight(studio.palette.paper));
}
function drawGuide() {
  const g = $('guide');
  const cg = studio.combGuide;
  if (!cg) { g.innerHTML = ''; return; }
  const [sx, sy] = cg.start, [ex, ey] = cg.end, dx = ex - sx, dy = ey - sy, len = Math.hypot(dx, dy);
  if (len < 0.01) { g.innerHTML = ''; return; }
  const mx = dx / len, my = dy / len, nx = -my, ny = mx;
  const color = isLight(studio.palette.paper) ? 'rgba(0,0,0,.28)' : 'rgba(255,255,255,.5)';
  let lines = '';
  for (let o = -0.75; o <= 0.7501; o += 0.07) {
    const cx = 0.5 + nx * o, cy = 0.5 + ny * o;
    lines += `<line x1="${cx - mx}" y1="${cy - my}" x2="${cx + mx}" y2="${cy + my}" stroke="${color}" stroke-width=".0025" stroke-dasharray=".004 .012"/>`;
  }
  lines += `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${color}" stroke-width=".006" stroke-linecap="round"/>`;
  g.innerHTML = lines;
}
function bindTray() {
  const tray = $('tray');
  const pt = e => { const r = tray.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
  tray.addEventListener('pointerdown', e => { tray.setPointerCapture(e.pointerId); touchBegan(...pt(e)); });
  tray.addEventListener('pointermove', e => touchMoved(...pt(e)));
  tray.addEventListener('pointerup', e => touchEnded(...pt(e)));
  tray.addEventListener('pointercancel', e => touchEnded(...pt(e)));
}
function buildMenu() {
  const menu = $('menu');
  const swatch = p => `<span class="swatches">${p.inks.slice(0, 4).map(([, h]) => `<i style="background:${h}"></i>`).join('')}</span>`;
  menu.innerHTML = `<div class="group-label">Palette</div>` +
    PALETTES.map(p => `<button data-palette="${p.id}" role="menuitemradio" aria-checked="${p.id === studio.palette.id}"><span>${p.id === studio.palette.id ? '✓ ' : ''}${p.name}</span>${swatch(p)}</button>`).join('') +
    `<div class="gap"></div><button data-act="surprise" role="menuitem"><span>Surprise Me</span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5 13.9 8l5.6 1.9-5.6 1.9L12 17.3l-1.9-5.5L4.5 9.9 10.1 8 12 2.5Z"/></svg></button>` +
    `<button data-act="clear" class="danger" role="menuitem" ${studio.ops.length ? '' : 'disabled style="opacity:.4"'}><span>Start Over</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>`;
  menu.querySelectorAll('[data-palette]').forEach(b => b.onclick = () => {
    studio.palette = PALETTES.find(p => p.id === b.dataset.palette); studio.ink = 0; buildInks(); closeMenu(); dirty();
  });
  menu.querySelector('[data-act="surprise"]').onclick = () => { closeMenu(); compose(studio); };
  menu.querySelector('[data-act="clear"]').onclick = () => { closeMenu(); if (confirm('Start over with clear water?')) clearTray(); };
}
function openMenu() { buildMenu(); $('menu').classList.add('open'); $('menu-scrim').classList.add('on'); }
function closeMenu() { $('menu').classList.remove('open'); $('menu-scrim').classList.remove('on'); }

// ---------------------------------------------------------------------------
// Navigation
// ---------------------------------------------------------------------------
function chrome(light) { $('status').classList.toggle('light', light); $('home').classList.toggle('light', light); }
function push(from, to) { $(from).classList.add('hidden-left'); $(to).classList.remove('hidden-right'); }
function pop(from, to) { $(from).classList.add('hidden-right'); $(to).classList.remove('hidden-left'); }

function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('on');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('on'), 4200);
}

// ---------------------------------------------------------------------------
// Server (holds the Arcade key)
// ---------------------------------------------------------------------------
async function api(path, body) {
  let res;
  try {
    res = await fetch(path, body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {});
  } catch {
    throw new Error("Can't reach the Ink & Water server. Is it running?");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || 'Something went wrong. Try again.');
  return data;
}
const money = p => new Intl.NumberFormat('en-US', {style: 'currency', currency: p.currency, maximumFractionDigits: 2, minimumFractionDigits: 0}).format(Number(p.amount));

// ---------------------------------------------------------------------------
// Make it real
// ---------------------------------------------------------------------------
const STYLES = [
  {id: 'nonpareil-hand-marbled', title: 'Nonpareil', summary: 'Keeps your composition and adds fine, feathered combing.'},
  {id: 'marbled-paper', title: 'Archival', summary: 'Freer and painterly. The marbler reinterprets your strokes.'},
];
const KINDS = [
  {id: 'scarf', name: 'Silk Scarf', icon: '<path d="M4 5h16v14H4z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 9c4 2 12-2 16 0M4 14c4 2 12-2 16 0" fill="none" stroke="currentColor" stroke-width="1.4"/>'},
  {id: 'pocket-square', name: 'Pocket Square', icon: '<path d="M6 8h12v10H6z M9 8l3-4 3 4" fill="none" stroke="currentColor" stroke-width="1.6"/>'},
  {id: 'pillow', name: 'Linen Pillow', icon: '<path d="M5 6c5 1.5 9 1.5 14 0-1.2 4-1.2 8 0 12-5-1.5-9-1.5-14 0 1.2-4 1.2-8 0-12Z" fill="none" stroke="currentColor" stroke-width="1.6"/>'},
];
const flow = {artwork: null, palette: null, title: '', style: STYLES[0].id, phase: 'choosing', finished: null, products: {}, showOriginal: false, run: 0};
const checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
const chevSvg = '<svg class="chev" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5 5-5 5"/></svg>';

let exportRenderer;
function renderArtwork() {
  const c = document.createElement('canvas');
  c.width = c.height = 1024;
  exportRenderer = new MarbleRenderer(c, {preserve: true});
  exportRenderer.draw(studio.ops, studio.palette);
  return c.toDataURL('image/png');
}

function openMake() {
  flow.artwork = renderArtwork();
  flow.palette = studio.palette;
  flow.title = $('title').value.trim() || 'Untitled';
  flow.phase = 'choosing'; flow.finished = null; flow.products = {}; flow.showOriginal = false; flow.run++;
  $('make-title').textContent = flow.title;
  renderMake();
  push('studio', 'make-screen');
}

function renderMake() {
  const el = $('make-content');
  $('make-bottom').style.display = flow.phase === 'choosing' ? '' : 'none';
  if (flow.phase === 'choosing') {
    el.innerHTML = `
      <div class="art"><img src="${flow.artwork}" alt="Your marbled piece"></div>
      <div style="margin-top:28px"><h2 class="section-title">Choose a finish</h2>
      <p class="sub">Arcade's marbling model turns your tray into a print-ready pattern in your colors. It takes about a minute.</p></div>
      <div class="styles">${STYLES.map(s => `<button class="style" data-style="${s.id}" aria-pressed="${s.id === flow.style}"><span class="check">${checkSvg}</span><span><b>${s.title}</b><span>${s.summary}</span></span></button>`).join('')}</div>`;
    el.querySelectorAll('.style').forEach(b => b.onclick = () => {
      flow.style = b.dataset.style; el.querySelectorAll('.style').forEach(x => x.setAttribute('aria-pressed', x.dataset.style === flow.style)); haptic();
    });
  } else if (flow.phase === 'finishing') {
    el.innerHTML = `
      <div class="art breathe"><img src="${flow.artwork}" alt="Your piece, being finished"><div class="sheen"></div></div>
      <div class="stage"><h3 id="stage-text">Preparing your inks</h3>
      <p class="sub">Arcade is finishing your piece. This usually takes about a minute.</p>
      <div class="bar-track"><div class="bar-fill" id="bar"></div></div></div>`;
  } else if (flow.phase === 'failed') {
    el.innerHTML = `<div class="error-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 2 20h20L12 3Z M12 10v4 M12 17h.01"/></svg>
      <h3>The marbler hit a snag</h3><p class="sub">${flow.error}</p><br><button class="prominent" id="retry" style="width:auto;padding:0 28px;margin:0 auto">Try Again</button></div>`;
    $('retry').onclick = () => { flow.phase = 'choosing'; renderMake(); };
  } else if (flow.phase === 'finished') {
    el.innerHTML = `
      <div class="art"><img id="img-original" src="${flow.artwork}" alt="Your tray" style="opacity:0">
      <img id="img-finished" src="${flow.finished.imageUrl}" alt="Your piece, finished by Arcade" style="opacity:0;transform:scale(.98)"></div>
      <div class="segmented" id="seg"><div class="thumb" id="seg-thumb"></div><button data-v="0">Finished</button><button data-v="1">Your Tray</button></div>
      <h2 class="section-title">Have it made</h2>
      <p class="sub">Each piece is printed and finished by hand by an independent maker, just for you.</p>
      <div class="card products" id="products"></div>`;
    const fin = $('img-finished');
    fin.onload = () => { fin.style.opacity = 1; fin.style.transform = 'none'; };
    el.querySelectorAll('#seg button').forEach(b => b.onclick = () => {
      flow.showOriginal = b.dataset.v === '1';
      $('seg-thumb').style.transform = flow.showOriginal ? 'translateX(100%)' : 'none';
      $('img-original').style.opacity = flow.showOriginal ? 1 : 0;
      fin.style.opacity = flow.showOriginal ? 0 : 1;
      haptic();
    });
    renderProducts();
  }
}

function renderProducts() {
  const box = $('products');
  if (!box) return;
  box.innerHTML = KINDS.map(k => {
    const r = flow.products[k.id];
    if (r && r.product) {
      const p = r.product;
      return `<button class="prow" data-kind="${k.id}"><span class="thumb-img" style="background-image:url('${p.images[0] || ''}')"></span>
        <span class="meta"><b>${k.name}</b><small>${p.detail || ''}</small></span><span class="price">${money(p.price)}</span>${chevSvg}</button>`;
    }
    const detail = r && r.error ? r.error : 'Building with the maker…';
    return `<div class="prow"><span class="thumb-img"><svg viewBox="0 0 24 24">${k.icon}</svg></span>
      <span class="meta"><b>${k.name}</b><small>${detail}</small></span>${r && r.error ? '' : '<span class="spinner"></span>'}</div>`;
  }).join('');
  box.querySelectorAll('button.prow').forEach(b => b.onclick = () => openProduct(flow.products[b.dataset.kind].product));
}

async function sendToMarbler() {
  const run = flow.run;
  flow.phase = 'finishing'; renderMake();
  const stages = [[0, 'Preparing your inks'], [8, 'Floating them on the water'], [22, 'Combing the pattern'], [40, 'Laying down the paper'], [55, 'Lifting the print']];
  const started = Date.now();
  const tick = setInterval(() => {
    const s = (Date.now() - started) / 1000;
    const text = [...stages].reverse().find(([t]) => t <= s)[1];
    const h = $('stage-text'), bar = $('bar');
    if (h && h.textContent !== text) { h.style.opacity = 0; setTimeout(() => { h.textContent = text; h.style.opacity = 1; }, 250); }
    if (bar) bar.style.width = Math.min(s / 65, 0.95) * 100 + '%';
  }, 500);
  try {
    const palette = flow.palette.inks.map(([, h]) => h).concat(flow.palette.paper);
    const {pieceId} = await api('/api/pieces', {image: flow.artwork.split(',')[1], palette, styleId: flow.style, title: flow.title});
    let piece;
    for (;;) {
      piece = await api(`/api/pieces/${pieceId}`);
      if (piece.status === 'succeeded') break;
      if (piece.status === 'failed') throw new Error(piece.message || "Arcade couldn't finish this piece.");
      if (Date.now() - started > 600000) throw new Error('Arcade is taking longer than usual. Try again.');
      await new Promise(r => setTimeout(r, 3000));
    }
    if (run !== flow.run) return;
    flow.finished = piece; flow.phase = 'finished'; renderMake(); haptic();
    KINDS.forEach(async k => {
      try { flow.products[k.id] = {product: await api('/api/products', {patternId: piece.patternId, kind: k.id})}; }
      catch (e) { flow.products[k.id] = {error: e.message}; }
      if (run === flow.run) renderProducts();
    });
  } catch (e) {
    if (run !== flow.run) return;
    flow.error = e.message; flow.phase = 'failed'; renderMake();
  } finally {
    clearInterval(tick);
  }
}

// ---------------------------------------------------------------------------
// Product and checkout
// ---------------------------------------------------------------------------
let current = null;
function openProduct(p) {
  current = p;
  $('product-name').textContent = p.name;
  $('product-content').innerHTML = `
    <div class="carousel" id="carousel">${p.images.map(u => `<img src="${u}" alt="Photo of your ${p.name.toLowerCase()}">`).join('')}</div>
    <div class="dots" id="dots">${p.images.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>
    <h2 class="ptitle">${p.title}</h2>
    <p class="sub">${p.detail || ''}</p>
    <div class="pprice">${money(p.price)}</div>
    ${p.maker ? `<div class="card maker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 11V6.5a1.5 1.5 0 0 1 3 0V11m0-1V5a1.5 1.5 0 0 1 3 0v5m0 0V6a1.5 1.5 0 0 1 3 0v6m0-2.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-2.7L4 14.5a1.6 1.6 0 0 1 2.7-1.7L8 14.5"/></svg><span>Made by hand by <b>${p.maker}</b>, an independent maker on Arcade</span></div>` : ''}
    <p class="desc">${p.description}</p>`;
  const car = $('carousel');
  car.onscroll = () => { const i = Math.round(car.scrollLeft / car.clientWidth); document.querySelectorAll('#dots i').forEach((d, j) => d.classList.toggle('on', i === j)); };
  $('buy').innerHTML = `Buy · ${money(p.price)}`;
  push('make-screen', 'product-screen');
}

function openCheckout() {
  const p = current;
  const sheet = $('sheet');
  sheet.innerHTML = `
    <div class="grabber"></div>
    <div class="sheet-head"><button class="navbtn" id="sheet-cancel" style="justify-self:start">Cancel</button><h3>Checkout</h3><span></span></div>
    <div style="display:flex;gap:14px;align-items:center;margin-bottom:16px"><span class="thumb-img" style="width:64px;height:64px;background-image:url('${p.images[0] || ''}')"></span>
      <span><b style="display:block;font-size:17px">${p.title}</b><small style="color:var(--label2);font-size:13px">${p.detail || ''}</small></span></div>
    <div class="card" style="padding:12px 16px">
      <div class="line"><span>Subtotal</span><span>${money(p.price)}</span></div>
      <div class="line"><span>Shipping</span><span>Calculated by Arcade</span></div>
      <div class="line total"><span>Total</span><span>${money(p.price)}</span></div>
    </div>
    <p id="checkout-error" style="color:var(--red);font-size:13px;text-align:center;min-height:18px"></p>
    <button class="prominent pay" id="place">Place Demo Order</button>
    <div class="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5h.01"/></svg>Demo checkout. You won't be charged and nothing ships.</div>`;
  $('sheet-cancel').onclick = closeCheckout;
  $('place').onclick = async () => {
    const btn = $('place');
    btn.disabled = true; btn.innerHTML = '<span class="spinner" style="border-top-color:var(--bg)"></span>Placing Order…';
    try {
      const order = await api('/api/checkout', {productId: p.productId, name: p.title, price: p.price});
      sheet.innerHTML = `<div class="grabber"></div>
        <div class="sheet-head"><span></span><span></span><button class="navbtn" id="sheet-done" style="justify-self:end;font-weight:600">Done</button></div>
        <div class="done"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 1.8 2.4 1.7 2.9-.2 1 2.8 2.5 1.5-.5 2.9 1.4 2.6-1.9 2.2-.2 2.9-2.8.8-1.7 2.4-2.8-.9-2.6 1.3-2.2-1.9-2.9-.1-.8-2.8-2.4-1.7.9-2.8-1.3-2.6 1.9-2.2.1-2.9 2.8-.8 1.7-2.4 2.8.9 2.6-1.3Z"/><path d="m7.8 12.3 2.8 2.8 5.6-5.6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <h3>Your piece is being made</h3><p class="num">Order ${order.orderNumber}</p>
        <p class="sub">${order.estimatedShip}</p><p class="sub" style="font-size:13px;margin-top:8px">${order.status}</p></div>`;
      $('sheet-done').onclick = closeCheckout;
      navigator.vibrate?.([10, 60, 20]);
    } catch (e) {
      $('checkout-error').textContent = e.message;
      btn.disabled = false; btn.textContent = 'Place Demo Order';
    }
  };
  $('sheet-backdrop').classList.add('on');
  sheet.classList.add('on');
}
function closeCheckout() { $('sheet').classList.remove('on'); $('sheet-backdrop').classList.remove('on'); }

// ---------------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------------
// Phone-sized touch screens get the real app; anything else gets the device frame, scaled to fit.
function fitDevice() {
  const native = matchMedia('(pointer: coarse)').matches && Math.min(innerWidth, innerHeight) < 500;
  document.body.classList.toggle('native', native);
  if (native) return;
  const scale = Math.min(1, (innerHeight - 48) / 852, (innerWidth - 48) / 393);
  $('device').style.transform = `translate(-50%, -50%) scale(${scale})`;
}

function start() {
  fitDevice();
  let welcome;
  try {
    welcome = new MarbleRenderer($('welcome-canvas'));
    trayRenderer = new MarbleRenderer($('tray-canvas'));
  } catch (e) {
    document.body.innerHTML = `<p style="padding:40px;font:17px var(--sans)">${e.message}</p>`;
    return;
  }
  const water = {ops: [], history: [], palette: PALETTES[0], composing: false};
  water.dirty = () => { welcome.resize(1.25); welcome.draw(water.ops, water.palette); };
  chrome(true);
  compose(water, 2026);
  nextFrame(() => $('welcome').classList.add('ready'));

  buildTools(); buildInks(); bindTray();
  $('begin').onclick = () => {
    $('welcome').classList.add('faded'); $('studio').classList.remove('faded'); chrome(false);
    dirty(); selectTool(studio.tool);
  };
  $('undo').onclick = undo;
  $('more').onclick = openMenu;
  $('menu-scrim').onclick = closeMenu;
  $('make').onclick = openMake;
  $('make-back').onclick = () => { flow.run++; pop('make-screen', 'studio'); };
  $('send').onclick = sendToMarbler;
  $('product-back').onclick = () => pop('product-screen', 'make-screen');
  $('buy').onclick = openCheckout;
  $('sheet-backdrop').onclick = closeCheckout;
  window.addEventListener('resize', () => { fitDevice(); water.dirty(); dirty(); });
  window.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); undo(); } });
}
start();
</script>
